spring:
  datasource:
    url: jdbc:h2:mem:stock_analysis_${random.uuid};MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

unified:
  performance:
    enabled: false
  report:
    enabled: false
  telegram:
    enabled: false
  analysis-schedule:
    enabled: false
  eod:
    worker-enabled: false

screener:
  swing-schedule:
    enabled: false

management:
  endpoint:
    health:
      show-details: always
